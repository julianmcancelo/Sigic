services:
  # ============================================================================
  # 1. Base de Datos: PostgreSQL 16
  # ============================================================================
  sigic-db:
    image: postgres:16-alpine
    container_name: sigic-postgres
    restart: always
    environment:
      POSTGRES_USER: sigic
      POSTGRES_PASSWORD: sigic_password_segura_2026
      POSTGRES_DB: sigic_db
    ports:
      - "5432:5432"
    volumes:
      - sigic_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigic -d sigic_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sigic-net

  # ============================================================================
  # 2. Plataforma Web: SiGIC (Next.js 16 + React 19)
  # ============================================================================
  sigic-web:
    build:
      context: ./codigo/plataforma
      dockerfile: Dockerfile
    container_name: sigic-app
    restart: always
    depends_on:
      sigic-db:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      # Conexión directa a la BD de PostgreSQL interna en la red Docker
      DATABASE_URL: "postgres://sigic:sigic_password_segura_2026@sigic-db:5432/sigic_db"
      DB_SSL_INSECURE: "1"
      JWT_SECRET: "sigic_super_secreto_para_firma_jwt_produccion_2026_xyz"
      NEXT_PUBLIC_APP_URL: "http://localhost:3000"
      PORT: "3000"
      # Configuración SMTP opcional (puede cambiarse por variables de entorno del servidor)
      SMTP_HOST: "${SMTP_HOST:-smtp.gmail.com}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASS: "${SMTP_PASS:-}"
      SMTP_FROM: "${SMTP_FROM:-no-reply@sigic.com.ar}"
    networks:
      - sigic-net

volumes:
  sigic_pgdata:
    driver: local

networks:
  sigic-net:
    driver: bridge
