services:
  # ─── SERVICIO DE BASE DE DATOS LOCAL (PostgreSQL 16) ───
  sigic-db:
    image: postgres:16-alpine
    container_name: sigic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: sigic_admin
      POSTGRES_PASSWORD: sigic_password_segura_2026
      POSTGRES_DB: sigic_db
    ports:
      - "5432:5432"
    volumes:
      - sigic_pgdata:/var/lib/postgresql/data
      - ./codigo/plataforma/public/Esquema_Base_Datos_SiGIC.sql:/docker-entrypoint-initdb.d/01_esquema.sql:ro
    networks:
      - sigic-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sigic_admin -d sigic_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ─── SERVICIO WEB SiGIC (Next.js 16 + React 19) ───
  sigic-web:
    build:
      context: ./codigo/plataforma
      dockerfile: Dockerfile
    container_name: sigic-plataforma
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Conexión automática al contenedor de PostgreSQL interno:
      - DATABASE_URL=postgresql://sigic_admin:sigic_password_segura_2026@sigic-db:5432/sigic_db?sslmode=disable
      - JWT_SECRET=sigic_jwt_secret_beltran_institucional_2026_academico
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
    depends_on:
      sigic-db:
        condition: service_healthy
    networks:
      - sigic-net

networks:
  sigic-net:
    driver: bridge

volumes:
  sigic_pgdata:
    driver: local
