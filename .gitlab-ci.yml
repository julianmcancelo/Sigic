# ==============================================================================
# GitLab CI/CD Pipeline - SiGIC
# Seguridad y Auditoría Automática + Compilación APK Flutter
# ==============================================================================

stages:
  - test
  - build
  - security

# Plantillas oficiales de Seguridad de GitLab Ultimate
include:
  - template: Security/Secret-Detection.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Dependency-Scanning.gitlab-ci.yml

# Variables globales para los escáneres de seguridad
variables:
  SECURE_LOG_LEVEL: "info"
  SECRET_DETECTION_HISTORIC_SCAN: "false"
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules, .next, dist"
  DS_EXCLUDED_PATHS: "spec, test, tests, tmp, node_modules, .next, dist, codigo/movil_flutter"
  SEARCH_MAX_DEPTH: 10

# Desactivar analizadores de Java/Maven automáticos (gestionamos el build Android explícitamente)
gemnasium-maven-dependency_scanning:
  rules:
    - when: never

# ------------------------------------------------------------------------------
# 1. Comprobación y Linter Web (Next.js)
# ------------------------------------------------------------------------------
lint-and-typecheck:
  stage: test
  image: node:20-alpine
  before_script:
    - cd codigo/plataforma
  script:
    - npm ci --prefer-offline --no-audit || npm install
    - npx next lint || true
  rules:
    - if: $CI_COMMIT_BRANCH == "master" || $CI_COMMIT_BRANCH == "beta" || $CI_MERGE_REQUEST_IID
  cache:
    key: ${CI_COMMIT_REF_SLUG}-web
    paths:
      - codigo/plataforma/node_modules/
      - codigo/plataforma/.next/cache/

# ------------------------------------------------------------------------------
# 2. Compilación Automática del APK Flutter (Portería)
# ------------------------------------------------------------------------------
build-flutter-apk:
  stage: build
  image: ghcr.io/cirruslabs/flutter:3.29.0
  before_script:
    - cd codigo/movil_flutter
    - flutter doctor -v
  script:
    - flutter pub get
    - flutter build apk --release --no-tree-shake-icons
    - mkdir -p ../../dist-apk
    - cp build/app/outputs/flutter-apk/app-release.apk ../../dist-apk/SIGIC-Porteria-Release.apk
  artifacts:
    name: "SIGIC-Porteria-APK-$CI_COMMIT_SHORT_SHA"
    paths:
      - dist-apk/SIGIC-Porteria-Release.apk
    expire_in: 30 days
  rules:
    # Se ejecuta al crear un tag (ej: movil-v1.0.8), o manualmente con un clic en GitLab
    - if: $CI_COMMIT_TAG =~ /^movil-/
    - if: $CI_COMMIT_BRANCH == "master"
      when: manual
      allow_failure: true

# ------------------------------------------------------------------------------
# 3. Escáner de Secretos
# ------------------------------------------------------------------------------
secret_detection:
  stage: security
  rules:
    - if: $CI_COMMIT_BRANCH
    - if: $CI_MERGE_REQUEST_IID
