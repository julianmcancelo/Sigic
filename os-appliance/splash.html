<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGIC Appliance</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 43%, rgba(14, 105, 139, 0.28), transparent 28rem),
                  radial-gradient(circle at 10% 100%, rgba(22, 70, 118, 0.32), transparent 32rem),
                  #03080e;
      color: #d9f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: min(520px, calc(100% - 40px));
      animation: fadeIn 0.8s ease-out;
    }
    .logo-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: grid;
      place-items: center;
      margin-bottom: 24px;
    }
    .logo-glow {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(100, 225, 232, 0.28);
      border-radius: 32px;
      background: rgba(91, 218, 227, 0.04);
      transform: rotate(45deg);
      animation: pulse 2.5s ease-in-out infinite;
    }
    .logo-img {
      position: relative;
      z-index: 2;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 0 0 8px rgba(91, 218, 227, 0.08), 0 18px 55px rgba(32, 195, 225, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo-img img {
      width: 80%;
      height: 80%;
      object-fit: contain;
    }
    .badge {
      color: #5fe6ed;
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    h1 {
      color: #f5feff;
      font-size: 38px;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }
    p.subtitle {
      color: rgba(225, 248, 250, 0.75);
      font-size: 16px;
      font-weight: 400;
      margin-bottom: 28px;
    }
    .progress-bar {
      width: 220px;
      height: 3px;
      background: rgba(116, 229, 235, 0.15);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 18px;
    }
    .progress-bar-fill {
      position: absolute;
      height: 100%;
      width: 45%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #6ce8e5, transparent);
      animation: sweep 1.4s ease-in-out infinite;
    }
    .status-text {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(194, 234, 239, 0.6);
      font-size: 11px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6ce8d3;
      box-shadow: 0 0 10px #6ce8d3;
    }
    footer {
      position: fixed;
      bottom: 24px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      color: rgba(192, 231, 235, 0.4);
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @keyframes pulse {
      50% {
        transform: rotate(45deg) scale(1.08);
        border-color: rgba(100, 225, 232, 0.45);
      }
    }
    @keyframes sweep {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <div class="logo-glow"></div>
      <div class="logo-img">
        <img src="logo.png" alt="SiGIC Logo" onerror="this.style.display='none'">
      </div>
    </div>
    <div class="badge">Gestión Institucional</div>
    <h1>SiGIC</h1>
    <p class="subtitle">Iniciando plataforma y servicios de colación...</p>
    <div class="progress-bar">
      <div class="progress-bar-fill"></div>
    </div>
    <div class="status-text">
      <div class="status-dot"></div>
      <span>Cargando servicios locales</span>
    </div>
  </div>

  <footer>
    <span>Instituto Tecnológico Beltrán</span>
    <span>Terminal Autónoma SiGIC</span>
  </footer>

  <script>
    // Redirigir a la plataforma automáticamente cuando esté lista
    function verificarServidor() {
      fetch('http://localhost:3000/api/estado', { mode: 'no-cors' })
        .then(() => {
          window.location.href = 'http://localhost:3000';
        })
        .catch(() => {
          setTimeout(verificarServidor, 1500);
        });
    }
    setTimeout(verificarServidor, 2000);
  </script>
</body>
</html>
