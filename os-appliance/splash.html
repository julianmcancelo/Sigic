<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SiGIC — Gestión de Colaciones</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 50% 35%, rgba(14, 105, 139, 0.35), transparent 28rem),
                  radial-gradient(circle at 15% 100%, rgba(22, 70, 118, 0.38), transparent 34rem),
                  #03080e;
      color: #d9f7fb;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    
    .noise-overlay {
      position: fixed;
      inset: 0;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      pointer-events: none;
    }

    .container {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: min(600px, calc(100% - 36px));
      animation: aparecerSuave 0.9s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .logo-container {
      position: relative;
      width: 110px;
      height: 110px;
      display: grid;
      place-items: center;
      margin-bottom: 18px;
    }
    .logo-glow {
      position: absolute;
      inset: 0;
      border: 1px solid rgba(100, 225, 232, 0.28);
      border-radius: 32px;
      background: rgba(91, 218, 227, 0.045);
      transform: rotate(45deg);
      animation: pulsoAura 3s ease-in-out infinite;
    }
    .logo-img {
      position: relative;
      z-index: 2;
      width: 72px;
      height: 72px;
      border-radius: 18px;
      background: #ffffff;
      box-shadow: 0 0 0 8px rgba(91, 218, 227, 0.07), 0 20px 50px rgba(32, 195, 225, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .logo-img img {
      width: 82%;
      height: 82%;
      object-fit: contain;
    }

    .badge {
      color: #5fe6ed;
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    h1 {
      color: #f5feff;
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.1;
      margin-bottom: 6px;
    }
    p.subtitle {
      color: rgba(225, 248, 250, 0.76);
      font-size: 15px;
      font-weight: 450;
      margin-bottom: 18px;
    }

    .progress-bar {
      width: 190px;
      height: 3px;
      background: rgba(116, 229, 235, 0.14);
      border-radius: 99px;
      overflow: hidden;
      position: relative;
      margin-bottom: 12px;
    }
    .progress-bar-fill {
      position: absolute;
      height: 100%;
      width: 48%;
      border-radius: inherit;
      background: linear-gradient(90deg, transparent, #6ce8e5, transparent);
      animation: barridoLuz 1.3s ease-in-out infinite;
    }
    .status-text {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(194, 234, 239, 0.65);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 22px;
    }
    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #6ce8d3;
      box-shadow: 0 0 10px #6ce8d3;
    }

    /* Tarjeta de los Alumnos / Proyecto */
    .project-card {
      background: rgba(10, 26, 44, 0.6);
      border: 1px solid rgba(100, 225, 232, 0.2);
      border-radius: 16px;
      padding: 14px 22px;
      width: 100%;
      backdrop-filter: blur(14px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.35);
      text-align: center;
    }
    .project-header {
      font-size: 11px;
      font-weight: 700;
      color: #6ee6e5;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(100, 225, 232, 0.16);
      padding-bottom: 7px;
    }
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 8px 18px;
      font-size: 12px;
      color: rgba(235, 250, 252, 0.92);
      font-weight: 500;
    }
    .team-member {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .team-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: #38bdf8;
      box-shadow: 0 0 6px rgba(56, 189, 248, 0.8);
    }

    footer {
      position: fixed;
      bottom: 20px;
      left: 32px;
      right: 32px;
      display: flex;
      justify-content: space-between;
      color: rgba(192, 231, 235, 0.45);
      font-family: ui-monospace, "Cascadia Code", monospace;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    @keyframes pulsoAura {
      50% {
        transform: rotate(45deg) scale(1.08);
        border-color: rgba(100, 225, 232, 0.48);
      }
    }
    @keyframes barridoLuz {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
    @keyframes aparecerSuave {
      from { opacity: 0; transform: translateY(14px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
  </style>
</head>
<body>
  <div class="noise-overlay" aria-hidden="true"></div>

  <div class="container">
    <div class="logo-container">
      <div class="logo-glow" aria-hidden="true"></div>
      <div class="logo-img">
        <img src="logo.png" alt="Logo SiGIC" onerror="this.style.display='none'">
      </div>
    </div>
    
    <div class="badge">Gestión Institucional de Colaciones</div>
    <h1>SiGIC</h1>
    <p class="subtitle">Iniciando el sistema...</p>
    
    <div class="progress-bar" aria-hidden="true">
      <div class="progress-bar-fill"></div>
    </div>
    
    <div class="status-text">
      <div class="status-dot"></div>
      <span>Cargando servicios</span>
    </div>

    <!-- Créditos simples y claros: Alumnos e Instituto -->
    <div class="project-card">
      <div class="project-header">Instituto Tecnológico Beltrán — Práctica Profesionalizante 2026</div>
      <div class="team-grid">
        <div class="team-member"><span class="team-dot"></span><span>Cancelo Julián</span></div>
        <div class="team-member"><span class="team-dot"></span><span>Alfonso Alan Alexis</span></div>
        <div class="team-member"><span class="team-dot"></span><span>Contreras Villalba Sol</span></div>
        <div class="team-member"><span class="team-dot"></span><span>Frassia Matías</span></div>
        <div class="team-member"><span class="team-dot"></span><span>Santillán Luis Gabriel</span></div>
      </div>
    </div>
  </div>

  <footer>
    <span>Instituto Tecnológico Beltrán</span>
    <span>SiGIC 2026</span>
  </footer>

  <script>
    function verificarServidor() {
      fetch('http://localhost:3000/api/estado', { mode: 'no-cors' })
        .then(() => {
          window.location.href = 'http://localhost:3000';
        })
        .catch(() => {
          setTimeout(verificarServidor, 1500);
        });
    }
    setTimeout(verificarServidor, 2000);
  </script>
</body>
</html>
