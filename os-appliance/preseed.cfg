#_preseed_V1
# Configuración desatendida ultraliviana para SiGIC OS (Debian Minimal)
d-i debian-installer/locale string es_AR.UTF-8
d-i console-setup/ask_detect boolean false
d-i keyboard-configuration/xkb-keymap select es

# Red
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string sigic-appliance
d-i netcfg/get_domain string local

# Espejo de paquetes
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

# Usuarios (sigic / sigic2026)
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string SiGIC Appliance
d-i passwd/username string sigic
d-i passwd/user-password password sigic2026
d-i passwd/user-password-again password sigic2026
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

# Particionado automático ultraliviano
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Paquetes esenciales mínimos (sin entornos de escritorio pesados como GNOME o KDE)
tasksel tasksel/first multiselect standard, ssh-server
d-i pkgsel/include string docker.io docker-compose-plugin git curl openbox xorg nodm chromium unclutter sudo
d-i pkgsel/upgrade select none
popularity-contest popularity-contest/participate boolean false

# Gestor de arranque GRUB
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

# Post-instalación: clonar SiGIC, configurar kiosco y créditos
d-i preseed/late_command string \
    in-target usermod -aG sudo,docker sigic; \
    in-target git clone https://github.com/julianmcancelo/Sigic.git /opt/sigic; \
    in-target chown -R sigic:sigic /opt/sigic; \
    in-target cp /opt/sigic/os-appliance/sigic.service /etc/systemd/system/sigic.service; \
    in-target systemctl enable sigic.service; \
    in-target bash /opt/sigic/os-appliance/setup-kiosk.sh; \
    in-target bash /opt/sigic/os-appliance/custom-branding.sh

d-i finish-install/reboot_in_progress note
