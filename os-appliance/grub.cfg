set default="0"
set timeout=3

set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan

insmod gzio
insmod part_gpt
insmod ext2

echo " "
echo "  ========================================================================"
echo "    SIGIC — SISTEMA DE GESTIÓN DE COLACIONES                              "
echo "    Instituto Tecnológico Beltrán — Práctica Profesionalizante 2026       "
echo "  ========================================================================"
echo "    Alumnos:"
echo "    • Cancelo Julián"
echo "    • Alfonso Alan Alexis"
echo "    • Contreras Villalba Sol Heilin"
echo "    • Frassia Matías"
echo "    • Santillán Luis Gabriel"
echo "  ========================================================================"
echo " "

menuentry "Iniciar SiGIC (Modo Automático)" {
	set gfxpayload=keep
	linux	/install.amd/vmlinuz auto=true priority=critical preseed/file=/cdrom/preseed.cfg quiet splash ---
	initrd	/install.amd/initrd.gz
}

menuentry "Iniciar SiGIC en Modo Seguro (Recuperación)" {
	set gfxpayload=keep
	linux	/install.amd/vmlinuz nomodeset auto=true priority=critical preseed/file=/cdrom/preseed.cfg ---
	initrd	/install.amd/initrd.gz
}
