menuentry "Probar SiGIC OS en Vivo (Directo a RAM — Sin Instalar)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz boot=casper toram quiet splash ---
	initrd	/casper/initrd
}

menuentry "Instalar SiGIC OS en el Disco (Instalación Automática)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz autoinstall ds=nocloud\;s=/cdrom/nocloud/ ---
	initrd	/casper/initrd
}

menuentry "Iniciar SiGIC en Modo Seguro (Diagnóstico / Recuperación)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz nomodeset boot=casper ---
	initrd	/casper/initrd
}
