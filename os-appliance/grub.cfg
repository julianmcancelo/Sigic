menuentry "Iniciar SiGIC Appliance OS (Modo Kiosco Automatico)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz quiet splash autoinstall ds=nocloud\;s=/cdrom/nocloud/ ---
	initrd	/casper/initrd
}

menuentry "Iniciar SiGIC en Modo Seguro / Diagnostico" {
	set gfxpayload=keep
	linux	/casper/vmlinuz nomodeset autoinstall ds=nocloud\;s=/cdrom/nocloud/ ---
	initrd	/casper/initrd
}
