set default="0"
set timeout=1

set menu_color_normal=cyan/black
set menu_color_highlight=black/light-cyan

insmod gzio
insmod part_gpt
insmod ext2

echo " "
echo "  ================================================================"
echo "    INICIANDO SIGIC OS APPLIANCE - SISTEMA DE GESTION DE COLACIONES"
echo "  ================================================================"
echo " "

menuentry "Iniciar SiGIC Appliance OS (Modo Kiosco Automatico)" {
	set gfxpayload=keep
	linux	/casper/vmlinuz quiet splash autoinstall ds=nocloud\;s=/cdrom/nocloud/ ---
	initrd	/casper/initrd
}

menuentry "Modo Seguro / Recuperacion de SiGIC" {
	set gfxpayload=keep
	linux	/casper/vmlinuz nomodeset autoinstall ds=nocloud\;s=/cdrom/nocloud/ ---
	initrd	/casper/initrd
}
