services:
  sigic-web:
    build:
      context: ./codigo/plataforma
      dockerfile: Dockerfile
    container_name: sigic-plataforma-cloud
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./codigo/plataforma/.env.local
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
