name: Compilar SiGIC OS Appliance (ISO)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del Appliance (ej: 1.0.0)'
        required: true
        default: '1.0.0'

jobs:
  build-iso:
    name: Compilar ISO Booteable
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas de compilación de ISO
        run: |
          sudo apt update
          sudo apt install -y p7zip-full xorriso isolinux wget

      - name: Ejecutar generación de ISO de SiGIC OS
        run: |
          cd os-appliance
          chmod +x build-iso.sh setup-kiosk.sh custom-branding.sh
          ./build-iso.sh
          rm -f ubuntu-base.iso debian-*.iso
          # Dividir la ISO en partes de 1.8GB (.iso.part00, .iso.part01) para no superar el límite de 2GB de GitHub
          7z a -v1800m sigic-os-ubuntu.7z sigic-os-*.iso

      - name: Subir imagen como Artifact de GitHub Actions (Descarga directa)
        uses: actions/upload-artifact@v4
        with:
          name: sigic-os-ubuntu-iso
          path: os-appliance/sigic-os-*.iso
          retention-days: 14

      - name: Subir ISO como Release de GitHub
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "sigic-os-v${{ github.event.inputs.version || '2.0.2' }}"
          name: "SiGIC OS Appliance v${{ github.event.inputs.version || '2.0.2' }}"
          draft: false
          prerelease: false
          files: os-appliance/sigic-os-ubuntu.7z.*
          body: |
            ### 💿 SiGIC OS Ubuntu Appliance (Booteable)
            
            Sistema Operativo autónomo con el Escritorio Oficial de SiGIC.
            
            - **Descarga**: Descargar las partes `sigic-os-ubuntu.7z.001` y descomprimir con 7-Zip o WinRAR.
            - También disponible como archivo directo en la pestaña **Artifacts** de este workflow.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
