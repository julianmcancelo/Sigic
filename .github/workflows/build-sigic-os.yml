name: Compilar SiGIC OS Appliance (ISO)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del Appliance (ej: 5.0.0)'
        required: true
        default: '5.0.0'

jobs:
  build-iso:
    name: Compilar ISO Booteable (Alpine Live Auto-Start)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas de compilación
        run: |
          sudo apt update
          sudo apt install -y xorriso isolinux syslinux-common wget tar

      - name: Ejecutar generación de SiGIC OS Live
        run: |
          cd os-appliance
          chmod +x build-alpine-live.sh
          ./build-alpine-live.sh

      - name: Subir ISO como Artifact de GitHub Actions (Descarga directa en 1 click)
        uses: actions/upload-artifact@v4
        with:
          name: sigic-os-live-iso
          path: os-appliance/sigic-os-*.iso
          retention-days: 14


      - name: Subir ISO a GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "sigic-os-v${{ github.event.inputs.version || '5.0.0' }}"
          name: "SiGIC OS XFCE Desktop Live v${{ github.event.inputs.version || '5.0.0' }}"
          draft: false
          prerelease: false
          files: os-appliance/sigic-os-*.iso
          body: |
            ### 💿 SiGIC OS Appliance (XFCE Desktop Live Edition)
            
            Sistema Operativo de escritorio completo con entorno gráfico **XFCE preinstalado** y acceso directo en RAM.
            
            - **Entorno Gráfico Completo**: Entra directamente al escritorio con el fondo Azul Beltrán y los 9 módulos de SiGIC.
            - **100% Preinstalado**: No requiere descargar paquetes ni ejecutar comandos en la terminal.
            - **Descarga Directa**: Archivo `.iso` único listo para VirtualBox o USB booteable.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}



