name: Compilar SiGIC OS Appliance (ISO)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del Appliance (ej: 4.0.0)'
        required: true
        default: '4.0.0'

jobs:
  build-iso:
    name: Compilar ISO Booteable (Alpine Extended Live)
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Instalar herramientas de compilación
        run: |
          sudo apt update
          sudo apt install -y xorriso isolinux syslinux-common wget tar

      - name: Ejecutar generación de Alpine Extended Live
        run: |
          cd os-appliance
          chmod +x build-alpine-live.sh
          ./build-alpine-live.sh

      - name: Subir ISO como Artifact de GitHub Actions (Descarga directa en 1 click)
        uses: actions/upload-artifact@v4
        with:
          name: sigic-os-alpine-live-iso
          path: os-appliance/sigic-os-*.iso
          retention-days: 14

      - name: Subir ISO a GitHub Releases (Archivo único sin compresión ni partes)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: "sigic-os-v${{ github.event.inputs.version || '4.0.0' }}"
          name: "SiGIC OS Alpine Extended Live v${{ github.event.inputs.version || '4.0.0' }}"
          draft: false
          prerelease: false
          files: os-appliance/sigic-os-*.iso
          body: |
            ### 💿 SiGIC OS Appliance (Alpine Linux Extended Edition)
            
            Sistema Operativo ultraliviano (~800 MB) diseñado específicamente para correr en **memoria RAM (Diskless)**.
            
            - **Arranque instantáneo**: Carga en 3 segundos en VirtualBox (tanto BIOS como UEFI).
            - **Sin instalación**: No toca ni pide particiones en el disco duro.
            - **Descarga directa**: Un único archivo `.iso` sin partes divididas.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


