name: Compilar SiGIC OS Appliance (ISO)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión del Appliance (ej: 7.3.0)'
        required: true
        default: '7.3.0'

jobs:
  build-iso:
    name: Compilar ISO (Debian live-build + Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout del Repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js para compilar SiGIC Web
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: codigo/plataforma/package-lock.json

      - name: Compilar Plataforma SiGIC Web (Standalone para el appliance)
        env:
          JWT_SECRET: "clave_temporal_solo_para_compilar_sigic_2026_beltran_0123456789"
          DATABASE_URL: "postgres://sigic:sigic@localhost:5432/sigic"
          NEXT_TELEMETRY_DISABLED: 1
        run: |
          cd codigo/plataforma
          npm ci --legacy-peer-deps
          npm run build
          DESTINO="$GITHUB_WORKSPACE/os-appliance/sigic-build"
          rm -rf "$DESTINO"
          mkdir -p "$DESTINO/.next"
          # El punto final es clave: copia también la carpeta oculta .next/ del standalone
          cp -a .next/standalone/. "$DESTINO/"
          cp -r public "$DESTINO/public"
          cp -r .next/static "$DESTINO/.next/static"
          node "$GITHUB_WORKSPACE/os-appliance/build_visual_assets.js"
          ls -la "$DESTINO"

      - name: Generar la ISO con Debian live-build (contenedor Debian 13)
        run: |
          docker run --rm --privileged \
            -e SIGIC_VERSION="${{ github.event.inputs.version }}" \
            -v "$GITHUB_WORKSPACE:/work" \
            debian:trixie bash /work/os-appliance/live-build/build.sh

      - name: Subir ISO como Artifact de GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: sigic-os-live-iso
          path: os-appliance/sigic-os-amd64.iso
          retention-days: 14
          compression-level: 0
