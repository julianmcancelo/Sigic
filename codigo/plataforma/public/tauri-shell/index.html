<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SiGIC Escritorio</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; color: #f7fbff; background: radial-gradient(circle at 20% 10%, #175578, transparent 38%), #071524; font: 500 14px "Segoe UI", sans-serif; }
      main { display: grid; justify-items: center; gap: 18px; text-align: center; }
      b { display: grid; place-items: center; width: 72px; height: 72px; border: 1px solid #7fe5f4; border-radius: 16px; color: #7fe5f4; box-shadow: 0 16px 40px #0008; font-size: 26px; }
      strong { letter-spacing: .16em; font-size: 19px; } p { margin: 0; color: #a9c3d6; font-size: 12px; }
      i { width: 28px; height: 28px; border: 3px solid #7fe5f4; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; } @keyframes spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body><main><b>S</b><strong>SIGIC</strong><p>Iniciando aplicación de escritorio</p><i></i></main></body>
</html>
